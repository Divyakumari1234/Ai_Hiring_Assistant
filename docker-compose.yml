services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - reachly-data:/app/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  reachly-data:
